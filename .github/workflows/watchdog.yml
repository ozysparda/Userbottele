name: watchdog-restart

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Cek status kedua userbot
        id: probe
        run: |
          te=$(gh run list --repo "${{ github.repository }}" --workflow userbot.yml --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
          wa=$(gh run list --repo "${{ github.repository }}" --workflow wabot.yml --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
          echo "userbot in_progress=$te  wabot in_progress=$wa"
          echo "telegram=$te" >> "$GITHUB_OUTPUT"
          echo "whatsapp=$wa" >> "$GITHUB_OUTPUT"

      - name: Dispatch Telegram kalau mati
        if: steps.probe.outputs.telegram == '0'
        run: gh workflow run userbot.yml --repo "${{ github.repository }}"

      - name: Dispatch WhatsApp kalau mati
        if: steps.probe.outputs.whatsapp == '0'
        run: gh workflow run wabot.yml --repo "${{ github.repository }}"