name: userbot-24-7

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: userbot
  cancel-in-progress: true

jobs:
  userbot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tulis .env dari secret ENV_BASE64
        run: |
          printf '%s' "$ENV_BASE64" | base64 -d > .env
          python -c "print('.env OK, baris terisi:', sum(1 for l in open('.env') if '=' in l and not l.strip().startswith('#')))"
        env:
          ENV_BASE64: ${{ secrets.ENV_BASE64 }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependensi
        run: pip install --no-input -q -r requirements.txt

      - name: Cek ffmpeg (sudah ada di image runner)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg tidak ada, install..."
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            echo "ffmpeg sudah tersedia:"
          fi
          ffmpeg -version | head -1

      - name: Jalankan userbot
        run: python -u UserBot.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          RUN_MINUTES: "360"
          REBOOT_LEAD: "240"